<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ניחושי תמונות · ניהול</title>
    <meta name="theme-color" content="#12294A">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&family=Rubik:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/program-skin.css">
    <link rel="stylesheet" href="css/shabbat-skin.css">
    <link rel="stylesheet" href="css/ai-gallery.css">
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/ai-gallery-config.js"></script>
    <script src="js/ai-admin.js" defer></script>
</head>
<body>
    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>טוען...</p>
    </div>

    <header class="modern-header">
        <div class="header-content">
            <div class="logo-container">
                <div class="main-logo">
                    <img src="assets/logos/or-israeli-logo.png" alt="אור ישראלי">
                </div>
            </div>
            <a href="index.html" class="back-button">
                <span class="material-icons">arrow_back</span>
                חזרה לדף הבית
            </a>
        </div>
    </header>

    <main class="modern-main guess-page">
        <section class="guess-hero">
            <h1>ניחושי התמונות</h1>
            <p>כאן רואים את הניחושים, וגם את פרטי הלייקים לבדיקה. השם, הטלפון וכתובת ה-IP לא מופיעים בשאר האתר.</p>
            <p><a href="admin.html">אפשר לנהל את הניחושים ואת הלייקים גם מתוך פאנל הניהול.</a></p>
        </section>

        <form id="admin-gate" class="admin-gate">
            <label for="admin-pin">קוד ניהול</label>
            <input id="admin-pin" type="password" autocomplete="current-password" required>
            <p id="admin-error" class="admin-error" hidden></p>
            <button type="submit">כניסה</button>
        </form>

        <section id="admin-panel" class="admin-panel" hidden>
            <div class="admin-toolbar">
                <p id="admin-summary">0 ניחושים</p>
                <label>
                    תמונה
                    <select id="admin-filter">
                        <option value="all">כל התמונות</option>
                    </select>
                </label>
            </div>
            <div id="admin-likes" class="admin-likes"></div>
            <div id="admin-list" class="admin-list"></div>
        </section>
    </main>
</body>
</html>
